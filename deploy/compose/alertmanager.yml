# Alerts go nowhere until you add a receiver. Telegram example below (uncomment and fill in).
route:
  receiver: "null"
  group_by: [alertname, chain]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # routes:
  #   - matchers: [ 'severity="critical"' ]
  #     receiver: telegram
receivers:
  - name: "null"
  # - name: telegram
  #   telegram_configs:
  #     - bot_token: "<from @BotFather>"
  #       chat_id: 123456789
  #       parse_mode: HTML
inhibit_rules:
  # When the whole chain is down, don't also page for every provider on it.
  - source_matchers: [ 'scope="chain"' ]
    target_matchers: [ 'scope=~"provider|slo"' ]
    equal: [chain]
